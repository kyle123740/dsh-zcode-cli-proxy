# dsh-zcode-cli-proxy bundle patch：把插件行插进 profile 组合树。
# 作为 profile 的一层补丁应用在 dsh-base / dsh-web-app 之后。
# 行 id（zcode2api）同时是 Config 页面里的设置分组键。
#
# name 必须是 package.json 的包名：loader 按包名从 profile 的 node_modules 解析
# （npm 安装 / link: 装配都走这条路）。
# 本地开发热重载（不装进 node_modules 的目录式装配）：把 name 换成 lib/index.js
# 的绝对 file:// URL 并加 ?v=N —— loader 只在行 name 变化时重新 import 模块，
# 而 Node ESM 以完整 URL 为缓存键；改完 lib/*.js 后递增 N，再禁用/启用本 bundle。
- insert:
    - id: zcode2api
      name: 'dsh-zcode-cli-proxy'
