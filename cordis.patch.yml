# dsh-zcode2api bundle patch：把插件行插进 profile 组合树。
# 作为 profile 的一层补丁应用在 dsh-base / dsh-web-app 之后。
# 行 id（zcode2api）同时是 Config 页面里的设置分组键。
#
# name 直接写入口文件的绝对 file:// URL：loader 只有在行 name 变化时才会
# 重新 import 模块，而 Node ESM 以完整 URL 为缓存键 —— 与包名
# （'dsh-zcode2api' 经 symlink 解析）不同的 URL 会触发一次全新的导入。
# 后续改 lib/*.js 后，改一下这里的名字（或在文件名后加 ?v=2、?v=3…）
# 再禁用/启用本 bundle，新代码即生效。
- insert:
    - id: zcode2api
      name: 'file:///E:/ai/dsh/plugins/dsh-zcode2api/lib/index.js?v=8'
